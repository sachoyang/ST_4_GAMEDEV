<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>면접 질문 — 게임 클라이언트 교안</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/site.js"></script>
</head>
<body data-root="../" data-section="interview">

<div id="site-header"></div>

<div class="wide">
  <section class="hero">
    <h1>면접 질문</h1>
    <p>총 <strong>204문항</strong>. 여기에는 <strong>말할 답변</strong>만 둔다.
       "왜 그런가"는 전부 <a href="../study/index.html">공부하기</a> 챕터로 링크한다 —
       같은 설명을 두 곳에 적어두면 반드시 한쪽이 낡기 때문이다.</p>
    <p class="muted">표시 규칙 — <strong>★★</strong> 실제 면접 출제 · <strong>★</strong> 강사 언급 · 무표시 추가 수집</p>
  </section>

  <div class="box warn">
    <span class="box-t">이식 예정</span>
    <p style="margin-bottom:0">원본은 <code>면접정리예제/01~08_*.md</code>에 이미 완성되어 있다.
       이 섹션은 그 내용을 <strong>답변 + 챕터 링크</strong> 형태로 재구성하는 작업이며,
       study 챕터가 어느 정도 채워진 뒤에 진행한다(링크 걸 대상이 있어야 하므로).</p>
  </div>

  <div id="map"></div>
</div>

<div id="site-footer"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("map").innerHTML = `
    <section class="part">
      <div class="part-head"><span class="part-id">Q</span><h2>분야별 문항</h2></div>
      <p class="part-tag">클릭하면 해당 분야 질문 목록으로 이동한다.</p>
      <div class="cards">
        ${SITE.interview.map((q, i) => `
          <a class="card ${q.status === "done" ? "" : "todo"}" href="${q.file}">
            <div class="card-top">
              <span class="card-num">${String(i + 1).padStart(2, "0")}</span>
              <span class="pill ${q.status}">${q.status === "done" ? "이식 완료" : "준비 중"}</span>
            </div>
            <h3>${q.title}</h3>
            <p>${q.count}문항</p></a>`).join("")}
      </div>
    </section>`;
});
</script>
</body>
</html>
